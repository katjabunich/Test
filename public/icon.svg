<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sun: warm peach/butter to cream radial -->
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%"   stop-color="#fffaf2"/>
      <stop offset="55%"  stop-color="#fff0c8"/>
      <stop offset="100%" stop-color="#f5c563"/>
    </radialGradient>
    <!-- Soft halo behind sun -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff5d6" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#f4936e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f4936e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm paper background, full bleed for "any maskable" -->
  <rect width="512" height="512" fill="#fbf6ee"/>

  <!-- Halo -->
  <circle cx="256" cy="186" r="220" fill="url(#halo)"/>

  <!-- Sun -->
  <circle cx="256" cy="186" r="128" fill="url(#sun)"/>

  <!-- Task list under the sun -->
  <!-- Row 1: mint-deep check + ink-80 stroke (done) -->
  <path d="M 132 372 L 155 393 L 192 354"
        stroke="#4f9c6a" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="212" y="364" width="172" height="9" rx="4.5"
        fill="#2d2620" fill-opacity="0.82"/>

  <!-- Row 2: ink-40 stroke (todo) -->
  <rect x="132" y="412" width="248" height="9" rx="4.5"
        fill="#2d2620" fill-opacity="0.38"/>

  <!-- Row 3: ink-40 shorter stroke (todo) -->
  <rect x="132" y="452" width="160" height="9" rx="4.5"
        fill="#2d2620" fill-opacity="0.38"/>
</svg>
